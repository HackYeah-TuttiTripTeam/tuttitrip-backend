[project]
name = "tuttitrip"
version = "0.1.0"
description = "Backend aplikacji TuttiTrip (HackYeah)"
readme = "README.md"
authors = [
    { name = "Cyprian Gburek", email = "cyprian@gburek.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "dbos>=3.2.0",
    "fastapi>=0.142.2",
    "fastmcp-slim[server]>=4.0.10",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "openpyxl>=3.1.5",
    "ortools>=9.15",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    # The harness requires exactly this pydantic-ai-slim; pydantic-ai follows it.
    "pydantic-ai==2.54.0",
    "pydantic-ai-harness==0.54.0",
    "pydantic-ai-slim[ag-ui,openai-realtime]==2.54.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-archon>=0.0.7",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "types-openpyxl>=3.1.5.20260827",
]

# --------------------------------------------------------------------------- #
# Ruff: lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Lint preview rules on: brings in pydoclint (DOC*) and other newer checks.
preview = true
select = ["ALL"]
# Minimal ignores. The google convention below already turns off the
# pydocstyle rules that conflict with it (D203/D213/D406/D407/...).
ignore = [
    # No per-file copyright/license header policy in this project.
    "CPY",
    # Conflicts with the formatter (trailing commas are managed by `ruff format`).
    "missing-trailing-comma",
    # Magic methods (`__eq__`, `__repr__`, ...) are self-explanatory.
    "undocumented-magic-method",
    # `__init__` is documented in the class docstring (google style).
    "undocumented-public-init",
    # "Raises:" sections are optional: we do not require listing exceptions...
    "docstring-missing-exception",
    # ...and we do not flag documented exceptions raised indirectly.
    "docstring-extraneous-exception",
    # Pydantic, FastAPI and SQLAlchemy read annotations at runtime, so imports
    # used "only" in annotations must stay real imports (not TYPE_CHECKING).
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "assert",                 # assert is the whole point of pytest
    "magic-value-comparison", # magic values are fine in test assertions
    "D",                      # test docstrings are optional
    "DOC",                    # ...and so are their Args/Returns sections
    "hardcoded-password-string",   # tests use made-up tokens and passwords
    "hardcoded-password-func-arg", # ...also as arguments
]
"scripts/**/*.py" = [
    "implicit-namespace-package", # standalone scripts, not a package
    "print",                      # output is the point of a smoke script
]
"migrations/**/*.py" = [
    "implicit-namespace-package", # Alembic's script directory is not a Python package
]
"deploy/admin/pgadmin/config_local.py" = [
    "implicit-namespace-package", # pgAdmin config mounted into its container, not a package
    "hardcoded-password-string",  # MASTER_PASSWORD_HOOK is a script path, not a password
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# --------------------------------------------------------------------------- #
# ty: type checking (strict)
# --------------------------------------------------------------------------- #
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "migrations"]

[tool.ty.rules]
# Every rule (including ones that default to `warn` or `ignore`) is an error.
all = "error"

# SQLAlchemy's typed idiom `x: Mapped[T] = mapped_column(...)` infers
# `MappedColumn[Any]`, which is assignable but not a strict subtype.
# Relax only that rule, and only in ORM model modules.
[[tool.ty.overrides]]
include = ["src/**/models.py"]

[tool.ty.overrides.rules]
unsound-assignment = "ignore"

[tool.ty.terminal]
# Non-zero exit code on any diagnostic, including warnings.
error-on-warning = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# Enables strict_config, strict_markers, strict_parametrization_ids, strict_xfail.
strict = true
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error"]
# CI runs `pytest -m "not integration and not e2e"`; the smoke step runs the rest locally.
markers = [
    "integration: needs a real Postgres, DBOS runtime or other service; local smoke step, not CI",
    "e2e: end to end against a running stack, network or real models; local smoke step, not CI",
]

# --------------------------------------------------------------------------- #
# Alembic (migrations live in ./migrations; the DB URL comes from Settings)
# --------------------------------------------------------------------------- #
[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

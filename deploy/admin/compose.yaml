# Admin tools behind the Auth0 gate: oauth2-proxy, pgAdmin, DBOS dashboard.
# Started by deploy/admin/setup.sh (never by hand): it generates the files
# under $TT_ADMIN_STATE (~/tuttitrip/admin, mode 700) from the host env file
# ~/tuttitrip/admin.env (plus copies of the repo files) and exports TT_ADMIN_STATE.
# Only tuttitrip-admin-gateway publishes a port, on the docker0 address that
# cloudflared reaches (not the LAN); everything else sits on the private
# tuttitrip-admin network behind it.
name: tuttitrip-admin

x-labels: &labels
  tuttitrip.managed: "true"
  tuttitrip.role: admin

services:
  admin-gateway:
    image: nginx:1.29-alpine
    container_name: tuttitrip-admin-gateway
    restart: unless-stopped
    ports:
      - ${TT_ADMIN_GATEWAY_BIND:-172.17.0.1:18081}:80
    volumes:
      - ${TT_ADMIN_STATE:?}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TT_ADMIN_STATE:?}/nginx.d:/etc/nginx/admin.d:ro
    networks: [admin]
    labels: *labels

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: tuttitrip-oauth2-proxy
    restart: unless-stopped
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    volumes:
      - ${TT_ADMIN_STATE:?}/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    networks: [admin]
    labels: *labels

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: tuttitrip-pgadmin
    restart: unless-stopped
    env_file: ${TT_ADMIN_STATE:?}/pgadmin.env
    environment:
      # IPv4 only: on [::] peers show up as ::ffff:a.b.c.d and never match
      # WEBSERVER_TRUSTED_PROXIES (the tuttitrip-admin IPv4 subnet).
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: "80"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_DISABLE_POSTFIX: "True"
      # libpq service file with the read-only role's password (servers.json
      # refers to the services, so nobody is asked for a password).
      PGSERVICEFILE: /run/secrets/pg_service.conf
    secrets: [pg_service.conf, pgadmin_master_password]
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ${TT_ADMIN_STATE:?}/config_local.py:/pgadmin4/config_local.py:ro
      - ${TT_ADMIN_STATE:?}/master-password.sh:/pgadmin4/tuttitrip-master-password.sh:ro
      - ${TT_ADMIN_STATE:?}/servers.json:/pgadmin4/servers.json:ro
    networks: [admin]
    labels: *labels

  dbos-dashboard:
    # Built and refreshed by the tuttitrip-worker deploy of main.
    image: tuttitrip-worker:main
    container_name: tuttitrip-dbos-dashboard
    restart: unless-stopped
    command: ["tuttitrip-dbos-dashboard"]
    env_file: ${TT_ADMIN_STATE:?}/dbos-dashboard.env
    networks: [admin]
    labels: *labels
    profiles: [dbos]  # setup.sh enables it once the image ships the dashboard
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  pg_service.conf:
    file: ${TT_ADMIN_STATE:?}/pg_service.conf
  pgadmin_master_password:
    file: ${TT_ADMIN_STATE:?}/pgadmin_master_password

networks:
  admin:
    external: true
    name: tuttitrip-admin

volumes:
  pgadmin-data:
    name: tuttitrip-pgadmin-data
    labels: *labels

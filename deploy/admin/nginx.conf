# tuttitrip-admin-gateway: the only entry to the admin tools (deploy/admin/).
#   tunnel -> 172.17.0.1:18081 -> this nginx -> auth_request to oauth2-proxy
#          -> tuttitrip-pgadmin | tuttitrip-dbos-dashboard   (network tuttitrip-admin)
# Separate from tuttitrip-gateway on purpose: every API deploy (any branch)
# rewrites that one from its own checkout. Unknown hosts get 404.
# Upstreams are variables, so nginx starts even when a backend is down.
worker_processes 1;
events { worker_connections 512; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;
    server_tokens off;
    # Header names with underscores are dropped (nginx default), so nobody can
    # smuggle e.g. X_Auth_Request_Email past the overwrites below.
    underscores_in_headers off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    map $host $tuttitrip_admin_upstream {
        tuttitrip-pgadmin.gburek.app tuttitrip-pgadmin:80;
        tuttitrip-dbos.gburek.app    tuttitrip-dbos-dashboard:8080;
        default "";
    }

    # Shared secret pgAdmin requires next to the identity header. The value
    # lives only on the host (written by deploy/admin/setup.sh); without the
    # file the header is empty, nginx drops it and pgAdmin accepts nobody.
    map $host $tuttitrip_pgadmin_secret {
        default "";
        include /etc/nginx/admin.d/pgadmin-secret.map*;
    }

    server {
        listen 80 default_server;
        return 404;
    }

    server {
        listen 80;
        server_name tuttitrip-pgadmin.gburek.app tuttitrip-dbos.gburek.app;
        client_max_body_size 50m;
        set $oauth2_proxy tuttitrip-oauth2-proxy:4180;

        # oauth2-proxy itself: sign_in, start, callback, sign_out.
        location /oauth2/ {
            proxy_pass http://$oauth2_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass http://$oauth2_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        location / {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_signin;

            # Identity from oauth2-proxy; these always overwrite (or blank)
            # whatever the client sent under the same names.
            auth_request_set $auth_user  $upstream_http_x_auth_request_user;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;
            proxy_set_header X-Auth-Request-User  $auth_user;
            proxy_set_header X-Auth-Request-Email $auth_email;
            proxy_set_header X-Forwarded-User     $auth_user;
            proxy_set_header X-Forwarded-Email    $auth_email;
            proxy_set_header X-Pgadmin-Webserver-Secret $tuttitrip_pgadmin_secret;

            proxy_pass http://$tuttitrip_admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }

        location @oauth2_signin {
            # Straight to Auth0 (no oauth2-proxy button); rd is a relative path.
            return 302 https://$host/oauth2/start?rd=$request_uri;
        }
    }
}

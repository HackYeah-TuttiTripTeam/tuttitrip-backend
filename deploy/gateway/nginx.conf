# tuttitrip-gateway: routes <name>.gburek.app to the container <name> on the
# private `tuttitrip` Docker network. Only names starting with tuttitrip-api
# are routable, so nothing else on the host can be reached through it.
worker_processes 1;
events { worker_connections 512; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;

    map $host $tuttitrip_upstream {
        ~^(?<name>tuttitrip-api(-[a-z0-9-]+)?)\.gburek\.app$ $name;
        default "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        client_max_body_size 20m;

        location / {
            if ($tuttitrip_upstream = "") { return 404; }
            proxy_pass http://$tuttitrip_upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Agent responses stream (SSE / AG-UI): do not buffer.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}

# tuttitrip-gateway: routes <name>.gburek.app to the container <name> on the
# private `tuttitrip` Docker network. Only names starting with tuttitrip-api
# are routable, so nothing else on the host can be reached through it.
worker_processes 1;
events { worker_connections 512; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;

    map $host $tuttitrip_upstream {
        ~^(?<name>tuttitrip-api(-[a-z0-9-]+)?)\.gburek\.app$ $name;
        default "";
    }

    # The caller's address: what Cloudflare says, else the socket peer. Sent
    # explicitly (and X-Forwarded-For replaced, not appended) so the API's
    # per-IP limits cannot be steered by headers a client adds.
    # Accepted risk: the gateway binds the docker0 bridge address, so a
    # container on the default bridge could send its own CF-Connecting-IP and
    # dodge the per-IP demo limit. The public path goes through Cloudflare,
    # which overwrites the header at the edge.
    map $http_cf_connecting_ip $tuttitrip_client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        client_max_body_size 20m;

        # Internal endpoints (the worker's daily demo reset) are reached on the
        # Docker network only, never through the public name.
        location /api/v1/internal/ { return 404; }

        # Receipt photos: a tighter limit than the server default (the API allows 5 MB).
        location ~ ^/api/v1/trips/[^/]+/expenses/receipts$ {
            client_max_body_size 6m;
            if ($tuttitrip_upstream = "") { return 404; }
            proxy_pass http://$tuttitrip_upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $tuttitrip_client_ip;
            proxy_set_header X-Forwarded-For $tuttitrip_client_ip;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            if ($tuttitrip_upstream = "") { return 404; }
            proxy_pass http://$tuttitrip_upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $tuttitrip_client_ip;
            proxy_set_header X-Forwarded-For $tuttitrip_client_ip;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Agent responses stream (SSE / AG-UI): do not buffer.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
